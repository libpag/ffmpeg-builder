name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    name: Package corresponding sources
    runs-on: ubuntu-24.04
    steps:
      - name: Check out builder sources
        uses: actions/checkout@v4

      - name: Install dependency sync tool
        run: npm install --global depsync@1.4.6

      - name: Check out pinned upstream sources
        run: depsync linux --project "$GITHUB_WORKSPACE" --non-recursive

      - name: Verify dependency commits
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          const deps = JSON.parse(fs.readFileSync("DEPS", "utf8"));
          for (const repo of deps.repos.common) {
            const actual = execFileSync("git", ["-C", repo.dir, "rev-parse", "HEAD"], {
              encoding: "utf8",
            }).trim();
            if (actual !== repo.commit) {
              throw new Error(`${repo.dir}: expected ${repo.commit}, found ${actual}`);
            }
          }
          NODE

      - name: Archive corresponding sources
        run: |
          mkdir -p dist
          git -C third_party/FFmpeg archive --format=tar.gz --prefix=FFmpeg/ \
            --output="$GITHUB_WORKSPACE/dist/ffmpeg-source.tar.gz" HEAD
          git -C third_party/x264 archive --format=tar.gz --prefix=x264/ \
            --output="$GITHUB_WORKSPACE/dist/x264-source.tar.gz" HEAD
          git archive --format=tar.gz --prefix=ffmpeg-builder/ \
            --output=dist/ffmpeg-builder-source.tar.gz HEAD
          cp THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES.zh_CN.md dist/

      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-sources
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
            platform: mac
            arch: arm64
          - target: mac-x64
            runner: macos-15-intel
            platform: mac
            arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - target: win-x86
            runner: windows-latest
            platform: win
            arch: x86
            msystem: MINGW32
            toolchain: nasm mingw-w64-i686-toolchain
          - target: win-x64
            runner: windows-latest
            platform: win
            arch: x64
            msystem: MINGW64
            toolchain: nasm mingw-w64-x86_64-toolchain
          - target: win-arm64
            runner: windows-11-arm
            platform: win
            arch: arm64
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Node.js on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: inherit
          install: >-
            base-devel git make pkgconf
            ${{ matrix.toolchain }}

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install nasm pkg-config
          npm install --global depsync@1.4.6

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential nasm pkg-config
          npm install --global depsync@1.4.6

      - name: Install Windows dependency sync tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm install --global depsync@1.4.6

      - name: Build FFmpeg on Unix
        if: runner.os != 'Windows'
        run: ./build.sh --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"

      - name: Build FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Arch ${{ matrix.arch }}

      - name: Package Unix executable
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -C "out/${{ matrix.target }}" -czf "dist/ffmpeg-${{ matrix.target }}.tar.gz" .

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "out/${{ matrix.target }}/*" `
            -DestinationPath "dist/ffmpeg-${{ matrix.target }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: dist/ffmpeg-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - sources
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          packages=(ffmpeg-*.tar.gz ffmpeg-*.zip THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES.zh_CN.md)
          sha256sum "${packages[@]}" > SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "FFmpeg $GITHUB_REF_NAME" \
            --generate-notes
